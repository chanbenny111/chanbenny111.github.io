<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XQ Team</title>
<meta name="description" content="Small, private iPhone apps by XQ Team.">
<style>
:root { --bg: #f6f3ee; --card: #fffdf9; --ink: #26211c; --ink2: #6b6258; --line: #e6dfd5; }
@media (prefers-color-scheme: dark) { :root { --bg: #171412; --card: #211d1a; --ink: #f1ebe4; --ink2: #a99f94; --line: #352f2a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
h1 { font-size: 28px; margin: 0 0 4px; }
p.lead { color: var(--ink2); margin: 0 0 32px; }
a.app { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 12px 0; color: inherit; text-decoration: none; }
a.app:hover { border-color: var(--ink2); }
a.app img { width: 64px; height: 64px; border-radius: 15px; flex: none; }
a.app b { display: block; font-size: 18px; }
a.app span { color: var(--ink2); font-size: 15px; }
footer { margin-top: 40px; color: var(--ink2); font-size: 14px; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>XQ Team</h1>
  <p class="lead">Small, private iPhone apps. No accounts, no tracking.</p>
  <a class="app" href="visitsleft/"><img src="assets/visitsleft.png" alt=""><div><b>Visits Left</b><span>How many more times will you see the people you love?</span></div></a>
  <a class="app" href="letitburn/"><img src="assets/letitburn.png" alt=""><div><b>Let It Burn</b><span>Write it. Scream at it. Watch it burn.</span></div></a>
  <footer>Contact: <a href="mailto:chanbenny111@gmail.com">chanbenny111@gmail.com</a></footer>
</main>
</body>
</html>
